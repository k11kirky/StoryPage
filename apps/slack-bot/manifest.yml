# Slack app manifest: https://api.slack.com/reference/manifests
# Create the app from this file, then set SLACK_BOT_TOKEN and SLACK_SIGNING_SECRET
# (or SLACK_APP_TOKEN for Socket Mode, in which case drop the request URLs).
display_information:
  name: StoryPage
  description: Builds Contentful pages from your Figma design system.
  background_color: "#2557d6"
features:
  bot_user:
    display_name: StoryPage
    always_online: true
  slash_commands:
    - command: /page
      url: https://storypage.example.com/slack/events
      description: Create or edit a page from the design system
      usage_hint: a landing page for our October webinar on AI search
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - commands
settings:
  event_subscriptions:
    request_url: https://storypage.example.com/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://storypage.example.com/slack/events
  socket_mode_enabled: false
