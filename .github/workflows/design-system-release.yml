# Stage 3: a design-system PR was merged. Deploy Storybook, then the content
# agent (Contentful + Storybook MCP) migrates the content model and existing
# content in a cloned environment, and switches the master alias only once
# every page validates.
name: Design system release

on:
  push:
    branches: [main]
    paths:
      - packages/design-system/**
  workflow_dispatch:

concurrency:
  group: design-system-release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  storybook:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        env:
          # Public gateway URL only. Draft previews are authorized per link by a
          # signature from the Slack bot; no Contentful token is in the bundle.
          STORYBOOK_PREVIEW_API_URL: ${{ vars.STORYPAGE_GATEWAY_URL }}
        run: pnpm --filter @storypage/design-system build-storybook --quiet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/design-system/storybook-static
      - id: deploy
        uses: actions/deploy-pages@v4

  contentful:
    needs: storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read release
        id: release
        run: |
          version=$(jq -r .version packages/design-system/src/generated/registry.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "design-system@$version" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migrate Contentful with the content agent
        if: steps.release.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENTFUL_LOCALE: ${{ vars.CONTENTFUL_LOCALE || 'en-US' }}
          STORYPAGE_AGENT_MAX_BUDGET_USD: ${{ vars.STORYPAGE_AGENT_MAX_BUDGET_USD || '25' }}
        run: |
          pnpm --filter @storypage/pipeline pipeline release \
            --storybook-url "${{ needs.storybook.outputs.url }}" \
            --strategy "${{ vars.CONTENTFUL_SYNC_STRATEGY || 'alias' }}" \
            ${{ vars.CONTENTFUL_KEEP_ENVIRONMENTS && format('--keep-environments {0}', vars.CONTENTFUL_KEEP_ENVIRONMENTS) || '' }} \
            ${{ vars.STORYPAGE_CONTENT_AGENT == 'false' && '--skip-agents' || '' }}
      - name: Report
        if: always()
        run: cat .storypage/content-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Tag release
        if: steps.release.outputs.new == 'true'
        run: |
          git tag "design-system@${{ steps.release.outputs.version }}"
          git push origin "design-system@${{ steps.release.outputs.version }}"
