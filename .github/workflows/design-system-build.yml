# Stage 2: a designer published from Figma. The gateway committed the manifest
# to design-system/v<version> and sent this dispatch. Agents build the
# components (Figma + Storybook MCP), an independent agent reviews them against
# Figma, and the result is opened as a PR for human review.
name: Design system build

on:
  repository_dispatch:
    types: [design-system-published]
  workflow_dispatch:
    inputs:
      version:
        description: Manifest version to build (packages/design-system/manifests/<version>.json)
        required: true

concurrency:
  group: design-system-build-${{ github.event.client_payload.version || inputs.version }}

permissions:
  contents: write
  pull-requests: write

env:
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
  BRANCH: design-system/v${{ github.event.client_payload.version || inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          # The agent's code runs during verification; keep the push token off disk until the push step.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for story screenshots
        run: pnpm --filter @storypage/agents exec playwright-core install --with-deps chromium

      - name: Build and review with agents
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Figma MCP (Framelink) reads the published file; without it agents use the manifest only.
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
          STORYPAGE_AGENT_MAX_BUDGET_USD: ${{ vars.STORYPAGE_AGENT_MAX_BUDGET_USD || '25' }}
        run: |
          # A failed verification still writes release.json and opens a draft PR
          # for a human to finish; any other failure (no release.json) fails the job.
          pnpm --filter @storypage/pipeline pipeline build --version "$VERSION" || true
          test -f .storypage/release.json
          echo "verified=$(jq -r .verified .storypage/release.json)" >> "$GITHUB_OUTPUT"
          cat .storypage/pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        env:
          # A PAT or GitHub App token lets the PR trigger CI; GITHUB_TOKEN-created PRs don't.
          PUSH_TOKEN: ${{ secrets.STORYPAGE_BOT_TOKEN || github.token }}
        run: |
          git config user.name "storypage-bot"
          git config user.email "storypage-bot@users.noreply.github.com"
          git add packages/design-system
          git diff --cached --quiet || git commit -m "Build design system $VERSION in Storybook" -m "$(jq -r '.tasks[]' .storypage/release.json)"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.STORYPAGE_BOT_TOKEN || github.token }}
          VERIFIED: ${{ steps.agent.outputs.verified }}
        run: |
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file .storypage/pr-body.md
          else
            draft=""
            [ "$VERIFIED" = "true" ] || draft="--draft"
            gh pr create --base main --head "$BRANCH" $draft \
              --title "Design system $VERSION" \
              --body-file .storypage/pr-body.md
          fi
